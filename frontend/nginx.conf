# nginx du frontend : sert le build React pré-rendu et proxifie /api vers le backend FastAPI.
# HTTPS est terminé en amont (Traefik / Dokploy) ; ce serveur n'écoute qu'en HTTP sur le réseau Docker.
#
# Gabarit : le Dockerfile copie ce fichier dans /etc/nginx/templates/default.conf.template ; au démarrage, l'image
# officielle nginx y substitue les variables d'environnement EMBED_ALLOWED_ORIGINS et SELLER_LANDING_URL (seules
# variables traitées, voir NGINX_ENVSUBST_FILTER) puis écrit /etc/nginx/conf.d/default.conf. Les variables nginx
# ($host, $args…) restent.

# Anciennes pages d'activité RGE (/entreprises-rge-a-vendre/activite/<domaine>) → annonces RGE du métier correspondant.
# Même correspondance que legacyListingsPath() (src/components/shared/listingFilters.js), vérifiée par
# src/pages/__tests__/listingsPage.test.jsx.
# Clés longues (jusqu'à 50 caractères) : seau de hachage agrandi
map_hash_bucket_size 128;
map $rge_activity $legacy_rge_target {
    default "/?rge=1";
    isolation-par-l-interieur-murs-rampants-plafonds "/?rge=1&metier=isolation";
    isolation-des-murs-par-l-exterieur "/?rge=1&metier=isolation";
    isolation-toiture-terrasse-par-l-exterieur "/?rge=1&metier=isolation";
    isolation-des-combles-perdus "/?rge=1&metier=isolation";
    isolation-plancher-bas "/?rge=1&metier=isolation";
    menuiseries-exterieures-fenetres-portes-volets "/?rge=1&metier=menuiserie";
    chauffage-au-bois-poeles-inserts-chaudieres "/?rge=1&metier=plomberie-chauffage";
    chaudieres-gaz-fioul-a-condensation "/?rge=1&metier=plomberie-chauffage";
    pompes-a-chaleur-air-eau "/?rge=1&metier=pac-clim-cvc";
    pompes-a-chaleur-geothermiques-eau-eau "/?rge=1&metier=pac-clim-cvc";
    pompes-a-chaleur-air-air "/?rge=1&metier=pac-clim-cvc";
    chauffe-eau-thermodynamique "/?rge=1&metier=pac-clim-cvc";
    capteurs-solaires-thermiques "/?rge=1&metier=photovoltaique-enr";
    systemes-solaires-combines "/?rge=1&metier=photovoltaique-enr";
    panneaux-photovoltaiques "/?rge=1&metier=photovoltaique-enr";
    ventilation-mecanique-controlee-vmc "/?rge=1&metier=pac-clim-cvc";
    audit-energetique "/?rge=1&metier=renovation-generale";
    bornes-de-recharge-vehicules-electriques "/?rge=1&metier=electricite";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # Redirections relatives (Location: /?metier=…) : nginx ne voit que du HTTP derrière Traefik
    absolute_redirect off;

    # Résolution DNS Docker à l'exécution : nginx démarre même si le backend n'est pas encore prêt
    resolver 127.0.0.11 valid=30s ipv6=off;
    # Alias réseau du service backend (docker-compose.yml) : unique, car le frontend est aussi sur dokploy-network
    set $backend_upstream http://cessionbatiment-api:8001;

    # www.<domaine> → <domaine> (301) : une seule origine (URL canonique, cookies, CSP). Déclarez les deux domaines
    # dans Dokploy (onglet Domains, service frontend) pour que Traefik délivre aussi le certificat du www.
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    # ---- Adresse réelle du client (limitation de débit, preuves de signature) ----
    # Seuls les proxys des réseaux privés (Traefik de Dokploy, réseau Docker) sont crus ; leur X-Forwarded-For donne
    # $remote_addr = premier pair non fiable en partant de la droite. Un X-Forwarded-For envoyé directement par un
    # client public est ignoré. Le backend reçoit ensuite une seule adresse (voir location /api/).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ---- En-têtes de sécurité (déclarés au niveau du serveur ; les blocs location n'utilisent que `expires`
    #      pour ne pas masquer ces en-têtes, add_header n'étant pas hérité quand un bloc en redéfinit) ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # CSP compatible avec le build (polices et pdf.js auto-hébergés, API sur la même origine, Stripe Identity hébergé).
    # script-src sans 'unsafe-inline' : aucun script en ligne n'est exécuté (les JSON-LD application/ld+json ne sont pas
    # des scripts exécutables et ne sont pas concernés).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' https://verify.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self' https://verify.stripe.com; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json;

    # ---- API : proxy vers le backend (jamais exposé directement) ----
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Remplacés (jamais allongés) : une seule adresse, celle calculée par le module realip
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 30m;
    }

    # Page des annonces pré-rendue (build/index.html)
    location = / {
        expires -1;
        try_files /index.html =404;
    }

    # Pages publiques pré-rendues : build/<route>/index.html (scripts/prerender.mjs), servies sans
    # redirection vers l'URL avec « / » final (URL canonique sans slash).
    # Autres routes (espaces connectés, annonces /company/:id…) : gabarit SPA vierge app-shell.html.
    # HTML jamais mis en cache sans revalidation, pour que les déploiements soient visibles immédiatement.
    location / {
        expires -1;
        try_files $uri $uri/index.html /app-shell.html;
    }

    # ---- Anciennes URL (pages marketing sorties de l'application, MODE-TEST-ET-APP.md §A.1) : 301 ----
    # Ancienne recherche : requête conservée ; les anciens noms de paramètres (metiers, rge_type, max_price, region en
    # toutes lettres…) sont traduits par la page des annonces (canonicalSearch, sans nouvelle entrée d'historique).
    location ~ ^/(?:entreprises-a-vendre|search|buyer/search)/?$ {
        return 301 /$is_args$args;
    }
    location ~ ^/entreprises-batiment-a-vendre/?$ {
        return 301 /;
    }
    location ~ ^/entreprises-batiment-a-vendre/metier/(?<legacy_slug>[a-z0-9-]+)/?$ {
        return 301 /?metier=$legacy_slug;
    }
    location ~ ^/entreprises-batiment-a-vendre/region/(?<legacy_slug>[a-z0-9-]+)/?$ {
        return 301 /?region=$legacy_slug;
    }
    location ~ ^/entreprises-rge-a-vendre/?$ {
        return 301 /?rge=1;
    }
    location ~ ^/entreprises-rge-a-vendre/region/(?<legacy_slug>[a-z0-9-]+)/?$ {
        return 301 /?rge=1&region=$legacy_slug;
    }
    location ~ ^/entreprises-rge-a-vendre/activite/(?<rge_activity>[a-z0-9-]+)/?$ {
        return 301 $legacy_rge_target;
    }
    location ~ ^/(?:reprendre-une-entreprise-[a-z-]+|guides(?:/.*)?|verifier-entreprise-rge)/?$ {
        return 301 /;
    }
    # Anciennes pages « vendre » : le cédant va vers la page « vendre » du site WordPress (SELLER_LANDING_URL, variable
    # du conteneur, ex. https://www.cessionbatiment.fr/vendre-mon-entreprise/), sinon vers l'estimateur, entrée du
    # parcours cédant de l'application (jamais vers la liste des annonces, qui s'adresse aux repreneurs)
    location ~ ^/vendre-mon-entreprise-[a-z-]+/?$ {
        set $seller_landing "${SELLER_LANDING_URL}";
        if ($seller_landing = "") {
            return 301 /estimer;
        }
        return 301 $seller_landing;
    }

    # ---- Module intégrable dans le site WordPress (/embed/annonces, docs/WORDPRESS.md) ----
    # Seule exception à « X-Frame-Options: DENY » : la page peut être affichée dans une iframe des origines listées
    # dans EMBED_ALLOWED_ORIGINS (variable du conteneur, origines séparées par des espaces, ex.
    # « https://www.cessionbatiment.fr https://cessionbatiment.fr » ; vide = même origine seulement).
    # add_header n'étant pas hérité quand un bloc en déclare, les autres en-têtes de sécurité sont repris ici.
    location ^~ /embed/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' ${EMBED_ALLOWED_ORIGINS}; upgrade-insecure-requests" always;
        expires -1;
        try_files /app-shell.html =404;
    }

    location = /index.html {
        expires -1;
    }

    location = /app-shell.html {
        expires -1;
    }

    # Fichiers de build versionnés (hash dans le nom, polices comprises) : cache long. « ^~ » : prioritaire sur la
    # règle des extensions ci-dessous (sinon les .woff2 de /static/media/ n'auraient qu'une semaine).
    location ^~ /static/ {
        expires 1y;
    }

    # Images, polices et icônes non versionnées (favicon, og-image…) : cache d'une semaine
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|webmanifest)$ {
        expires 7d;
    }

    # Health check du conteneur frontend
    location = /health {
        default_type text/plain;
        return 200 'OK';
    }
}
